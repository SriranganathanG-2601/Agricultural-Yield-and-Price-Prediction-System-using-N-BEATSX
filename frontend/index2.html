<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FutureCrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-header {
            background: var(--green-primary);
            padding: 20px 5%;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dashboard-header .logo-icon {
            font-size: 2rem;
        }

        .dashboard-header h1 {
            color: var(--green-primary);
            font-size: 1.8rem;
        }

        .dashboard-header h1 span {
            color: var(--orange);
        }

        .dashboard-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            padding: 30px 5%;
            background: #f5f5f5;
        }

        .trends-section {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .trends-section h2 {
            font-size: 1.5rem;
            padding: 20px;
            margin: 0;
            color: var(--text-dark);
        }

        .trends-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trends-table th {
            background: #f9f9f9;
            padding: 12px 20px;
            text-align: left;
            font-weight: 500;
            color: #666;
            font-size: 0.9rem;
        }

        .trends-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }

        .trends-table tr:hover {
            background: #f9f9f9;
        }

        .change-positive {
            color: #2e7d32;
            font-weight: 500;
        }

        .change-negative {
            color: #c62828;
            font-weight: 500;
        }

        .price-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .price-card {
            background: #ffc107;
            border-radius: 8px;
            padding: 25px;
        }

        .price-card .date {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .price-card .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .price-card .item:last-child {
            border-bottom: none;
        }

        .price-card .item-name {
            font-weight: 500;
            color: #333;
        }

        .price-card .item-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
        }

        .price-card .item-change {
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .explore-section {
            padding: 40px 5%;
            background: #f5f5f5;
        }

        .explore-section h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .dashboard-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="index.html#about">ABOUT</a></li>
            <li><a href="index.html#services">SERVICE</a></li>
            <li><a href="predict.html">PREDICT</a></li>
            <li><a href="commodity.html">COMMODITY</a></li>
            <li><a href="upload.html">UPLOAD</a></li>
            <li><a href="accuracy.html">ACCURACY</a></li>
        </ul>
    </nav>

    <div class="dashboard-header">
        <span class="logo-icon">🌾</span>
        <h1 style="color: #2e7d32;">Future<span>Crop</span></h1>
    </div>

    <div class="dashboard-content">
        <div class="trends-column">
            <div class="trends-section" style="margin-bottom: 30px;">
                <h2>Top Gainers(Current trends)</h2>
                <table class="trends-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Price (per Qtl.)</th>
                            <th>Change</th>
                        </tr>
                    </thead>
                    <tbody id="gainersBody">
                        <tr>
                            <td colspan="3">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="trends-section">
                <h2>Top Losers(Current trends)</h2>
                <table class="trends-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Price (per Qtl.)</th>
                            <th>Change</th>
                        </tr>
                    </thead>
                    <tbody id="losersBody">
                        <tr>
                            <td colspan="3">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="price-cards" id="priceCards">
            <div class="price-card">
                <div class="date">Loading...</div>
            </div>
        </div>
    </div>

    <section class="explore-section">
        <h2>Explore by commodity</h2>
        <p><a href="commodity.html" style="color: var(--green-primary);">View all commodities →</a></p>
    </section>

    <button class="scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_URL}/api/dashboard`);
                const data = await res.json();

                // Render gainers
                const gainersBody = document.getElementById('gainersBody');
                gainersBody.innerHTML = data.gainers.map(item => `
                    <tr>
                        <td>${item.name}</td>
                        <td>₹${item.price}</td>
                        <td class="change-positive">${item.change}% ▲</td>
                    </tr>
                `).join('');

                // Render losers
                const losersBody = document.getElementById('losersBody');
                losersBody.innerHTML = data.losers.map(item => `
                    <tr>
                        <td>${item.name === 'Urad' ? '<span style="background: #2e7d32; color: white; padding: 2px 8px; border-radius: 3px;">Urad</span>' : item.name}</td>
                        <td>₹${item.price}</td>
                        <td class="change-negative">${item.change}% ▼</td>
                    </tr>
                `).join('');

                // Render price cards
                const priceCards = document.getElementById('priceCards');
                priceCards.innerHTML = data.priceCards.map(card => `
                    <div class="price-card">
                        <div class="date">${card.month}</div>
                        ${card.items.map(item => `
                            <div class="item">
                                <div><div class="item-name">${item.name}</div></div>
                                <div style="text-align: right;">
                                    <div class="item-price">₹${item.price}</div>
                                    <div class="item-change ${item.change < 0 ? 'change-negative' : 'change-positive'}">${item.change}% ${item.change < 0 ? '▼' : '▲'}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        loadDashboard();
    </script>
</body>

</html>
