<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - FutureCrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .upload-page {
            padding: 60px 5%;
            background: #f5f5f5;
            min-height: calc(100vh - 60px);
        }

        .upload-page h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            color: var(--text-dark);
        }

        .upload-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--green-primary);
            background: #f8fff8;
        }

        .upload-area.dragover {
            border-color: var(--green-primary);
            background: #e8f5e9;
        }

        .upload-area .icon {
            font-size: 4rem;
            color: var(--green-primary);
            margin-bottom: 20px;
        }

        .upload-area h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .upload-area p {
            color: #666;
            margin-bottom: 20px;
        }

        .upload-area .browse-btn {
            background: var(--green-primary);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-area .browse-btn:hover {
            background: var(--green-dark);
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info i {
            color: var(--green-primary);
            margin-right: 10px;
        }

        .upload-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--green-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-btn:hover {
            background: var(--green-dark);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>

<body>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="index.html#about">ABOUT</a></li>
            <li><a href="index.html#services">SERVICE</a></li>
            <li><a href="predict.html">PREDICT</a></li>
            <li><a href="commodity.html">WORKING</a></li>
            <li><a href="#" class="active">UPLOAD</a></li>
            <li><a href="accuracy.html">ACCURACY</a></li>
        </ul>
    </nav>

    <section class="upload-page">
        <h1>Upload Agricultural Data</h1>

        <div class="upload-container">
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <h3>Drag & Drop your file here</h3>
                <p>or click to browse</p>
                <button class="browse-btn">Browse Files</button>
                <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden>
            </div>

            <div class="file-info" id="fileInfo">
                <i class="fas fa-file-csv"></i>
                <span id="fileName"></span>
            </div>

            <button class="upload-btn" id="uploadBtn" disabled onclick="uploadFile()">
                <i class="fas fa-upload"></i> Upload & Process
            </button>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </section>

    <button class="scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        const API_URL = 'http://127.0.0.1:5000';
        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        function selectFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            uploadBtn.disabled = false;
        }

        async function uploadFile() {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch(`${API_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                statusMessage.className = 'status-message show success';
                statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message}`;

                // Reset
                selectedFile = null;
                fileInfo.classList.remove('show');
                fileInput.value = '';

            } catch (err) {
                statusMessage.className = 'status-message show error';
                statusMessage.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: ${err.message}`;
            }

            uploadBtn.disabled = false;
            uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload & Process';
        }
    </script>
</body>

</html>
